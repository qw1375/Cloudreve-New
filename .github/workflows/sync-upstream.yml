# .github/workflows/sync-upstream.yml
# 自动同步上游 Dark-CC/Cloudreve-New 的 master 分支
# 策略：定时检查 -> 合并 -> 无冲突直接推送；有冲突开 PR/分支并人工处理
name: Sync Upstream

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC（北京时间 11:17）检查一次
  workflow_dispatch:
    inputs:
      force:
        description: "强制同步（即使无新提交）"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/Dark-CC/Cloudreve-New.git
  UPSTREAM_BRANCH: master
  SYNC_BRANCH: upstream-sync/auto

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 必须全量历史，否则 merge 报 unrelated histories
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check if sync needed
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          BASE=$(git merge-base HEAD upstream/${UPSTREAM_BRANCH})
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          if [ "$BASE" = "$REMOTE" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新，无需同步"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "上游新提交: $(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH}) 个"
          fi

      - name: Try merge (theirs bias for upstream-owned files)
        id: merge
        if: steps.check.outputs.needed == 'true'
        run: |
          git checkout -B "$SYNC_BRANCH"
          # 对上游占主导的文件优先采用上游版本，减少冲突：
          # Dockerfile / release 工作流 / 依赖锁文件跟随上游
          git merge --no-edit upstream/${UPSTREAM_BRANCH} \
            || git merge --no-edit -X theirs upstream/${UPSTREAM_BRANCH}
          if git ls-files -u | grep -q .; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge to master
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git checkout master
          git merge --ff-only "$SYNC_BRANCH" || git merge --no-edit "$SYNC_BRANCH"
          git push origin master
          git branch -D "$SYNC_BRANCH"

      - name: Open PR on conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          git merge --no-edit -X theirs upstream/${UPSTREAM_BRANCH} || true
          git push -f origin "$SYNC_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create conflict PR
        if: steps.merge.outputs.conflict == 'true'
        run: |
          gh pr create \
            --title "chore: sync upstream Dark-CC/Cloudreve-New ($(date +%F))" \
            --body "自动同步检测到合并冲突，已用 -X theirs 预合并，请人工核对定制改动（见 SYNC.md 定制清单）后合入。" \
            --head "$SYNC_BRANCH" --base master \
            || echo "PR 可能已存在"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
