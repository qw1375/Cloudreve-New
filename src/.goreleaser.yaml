version: 2

env:
  - GOFLAGS=-mod=mod
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0

    binary: cloudreve

    ldflags:
      - -s -w
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion={{.Version}}'
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit={{.ShortCommit}}'
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.IsPro=false'

    goos:
      - linux
      - windows
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm
      - arm64
      - loong64

    goarm:
      - 5
      - 6
      - 7

    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    # Same layout as the official releases so existing scripts keep working.
    name_template: >-
      cloudreve_{{.Version}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: qw1375
    name: Cloudreve-New
  draft: false
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  name_template: "Cloudreve-New {{.Version}}"
  header: |
    ## 下载

    按平台选择压缩包，解压后即为单一静态二进制 `cloudreve`（Windows 为 `cloudreve.exe`），
    无需安装 Go、Node.js 或其他运行时依赖。

    | 平台 | 架构 | 文件 |
    | --- | --- | --- |
    | Linux | x86-64 | `cloudreve_{{ .Version }}_linux_amd64.tar.gz` |
    | Linux | ARM64 | `cloudreve_{{ .Version }}_linux_arm64.tar.gz` |
    | Linux | ARMv7 / ARMv6 / ARMv5 | `cloudreve_{{ .Version }}_linux_armv7.tar.gz` 等 |
    | Linux | LoongArch64 | `cloudreve_{{ .Version }}_linux_loong64.tar.gz` |
    | Windows | x86-64 | `cloudreve_{{ .Version }}_windows_amd64.zip` |
    | Windows | ARM64 | `cloudreve_{{ .Version }}_windows_arm64.zip` |
    | macOS | Apple Silicon | `cloudreve_{{ .Version }}_darwin_arm64.tar.gz` |
    | macOS | Intel | `cloudreve_{{ .Version }}_darwin_amd64.tar.gz` |
    | FreeBSD | x86-64 / ARM64 | `cloudreve_{{ .Version }}_freebsd_amd64.tar.gz` 等 |

    每个压缩包内含 `cloudreve`、`LICENSE` 与 `NOTICE`。

    ## 校验

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    ```

    ## 运行

    ```bash
    tar -xzf cloudreve_{{ .Version }}_linux_amd64.tar.gz
    chmod +x cloudreve
    ./cloudreve -c data/conf.ini server
    ```

    默认监听 `:5212`，首次启动会创建 `data/` 目录与 SQLite 数据库，并在控制台输出管理员账号。

    ## 容器镜像

    ```bash
    docker run -d --name cloudreve \
      -p 5212:5212 -p 6888:6888 -p 6888:6888/udp \
      -v $(pwd)/data:/cloudreve/data \
      ghcr.io/dark-cc/cloudreve-new:{{ .Version }}
    ```

    多架构镜像（`linux/amd64`、`linux/arm64`）与本 Release 由同一工作流构建并推送。

    ## 文档

    - 构建说明：[docs/BUILD.md](https://github.com/Dark-CC/Cloudreve-New/blob/{{ .Tag }}/docs/BUILD.md)
    - 部署说明：[docs/DEPLOY.md](https://github.com/Dark-CC/Cloudreve-New/blob/{{ .Tag }}/docs/DEPLOY.md)
    - 功能清单：[docs/FEATURES.md](https://github.com/Dark-CC/Cloudreve-New/blob/{{ .Tag }}/docs/FEATURES.md)

  footer: |
    ## 关于本项目

    - 基于 Cloudreve v4 社区版源码的非官方增强分支，与 Cloudreve 官方无任何关联。
    - 不包含、不分发、不反编译任何 Pro 版本的二进制、前端产物或授权逻辑。
    - 遵循 GPL-3.0，对应源码：[{{ .Tag }}](https://github.com/Dark-CC/Cloudreve-New/tree/{{ .Tag }})

# The container image is published by the `docker` job of the same release
# workflow, so a tag push produces both the archives and the multi-arch image.
